<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - CodeEdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex; justify-content: center; align-items: center;
            background:
                radial-gradient(ellipse 80% 60% at 20% 40%, var(--accent-soft) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, var(--mint-soft) 0%, transparent 50%),
                var(--bg-section);
            padding: 48px 20px;
            position: relative;
            overflow: hidden;
        }
        .auth-page::before {
            content: ''; position: absolute;
            top: -200px; right: -100px; width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .auth-card {
            background: var(--bg-surface);
            border-radius: 28px;
            padding: 52px 44px;
            width: 100%; max-width: 460px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-card);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .auth-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 28px 64px rgba(15,23,42,0.10), 0 12px 24px rgba(15,23,42,0.06);
        }
        .auth-logo {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 36px; text-decoration: none;
        }
        .auth-logo-mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--mint));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.28);
        }
        .auth-logo-name {
            font-size: 1.45rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--mint));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-title {
            font-size: 1.7rem; font-weight: 800; color: var(--ink-1);
            margin-bottom: 8px; letter-spacing: -0.035em;
        }
        .auth-sub {
            font-size: .95rem; color: var(--ink-2); line-height: 1.6;
        }

        /* 스텝 인디케이터 */
        .step-indicator {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-bottom: 32px;
        }
        .step {
            width: 38px; height: 38px; border-radius: 50%;
            font-size: .88rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--border-card);
            color: var(--ink-3); background: var(--bg-surface);
            transition: all 0.3s ease;
        }
        .step.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-h));
            color: white; border-color: transparent;
            box-shadow: 0 4px 14px rgba(16,185,129,0.28);
        }
        .step.done {
            background: var(--success); color: white;
            border-color: var(--success);
        }
        .step-line { width: 56px; height: 3px; background: var(--border); border-radius: 3px; }
        .step-line.done { background: linear-gradient(90deg, var(--success), var(--accent)); }

        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; font-size: .86rem; font-weight: 600;
            color: var(--ink-1); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px; border-radius: 14px;
            border: 1.5px solid var(--border-card);
            background: var(--bg); color: var(--ink-1);
            font-size: .95rem; font-family: inherit;
            transition: all 0.2s ease; outline: none;
            box-shadow: var(--shadow-xs);
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-sm);
            background: var(--bg-surface);
        }
        .form-group input::placeholder { color: var(--ink-3); }
        .hint-text { font-size: .82rem; color: var(--ink-3); margin-top: 8px; font-weight: 500; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-h));
            color: #fff; border: none;
            padding: 16px; border-radius: 16px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; letter-spacing: -0.01em;
            transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 6px 20px rgba(16,185,129,0.30), 0 2px 6px rgba(16,185,129,0.15);
            margin-top: 6px;
        }
        .btn-submit:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(16,185,129,0.38), 0 4px 10px rgba(16,185,129,0.18);
        }
        .btn-submit:active { transform: translateY(0); }
        .auth-links {
            margin-top: 28px;
            font-size: .88rem; color: var(--ink-2);
            text-align: center; line-height: 1.8;
        }
        .auth-links a {
            color: var(--accent); font-weight: 600;
            text-decoration: none; position: relative;
        }
        .auth-links a::after {
            content: ''; position: absolute; bottom: -1px; left: 0;
            width: 0; height: 1.5px; background: var(--accent);
            transition: width 0.25s ease;
        }
        .auth-links a:hover::after { width: 100%; }
        .alert-error {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 14px 16px; border-radius: 14px;
            font-size: .88rem; font-weight: 500; margin-bottom: 24px;
            background: var(--danger-soft); color: var(--danger);
            border: 1px solid rgba(239,68,68,0.12);
        }
        .alert-icon {
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .7rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
            background: var(--danger); color: #fff;
        }
    </style>
</head>
<body>

<nav th:replace="~{index :: nav}"></nav>

<div class="auth-page">
    <div class="auth-card reveal">

        <a href="/" class="auth-logo">
            <div class="auth-logo-mark">💻</div>
            <span class="auth-logo-name">CodeEdu</span>
        </a>

        <!-- ===== 2단계: 새 비밀번호 설정 ===== -->
        <th:block th:if="${resetStep}">
            <div class="auth-header">
                <h2 class="auth-title">새 비밀번호 설정</h2>
                <p class="auth-sub">사용하실 새 비밀번호를 입력해주세요.</p>
            </div>

            <div class="step-indicator">
                <div class="step done">✓</div>
                <div class="step-line done"></div>
                <div class="step active">2</div>
            </div>

            <div th:if="${resetError}" class="alert alert-error">
                <span class="alert-icon">!</span>
                <span th:text="${resetError}"></span>
            </div>

            <form th:action="@{/forgot-password/reset}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="8자 이상 입력하세요" required autofocus>
                    <p class="hint-text">영문, 숫자 포함 8자 이상</p>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <button type="submit" class="btn-submit">비밀번호 변경하기</button>
            </form>
        </th:block>

        <!-- ===== 1단계: 본인 확인 ===== -->
        <th:block th:unless="${resetStep}">
            <div class="auth-header">
                <h2 class="auth-title">비밀번호 찾기</h2>
                <p class="auth-sub">가입 시 등록한 아이디와 이메일을 입력하면<br>비밀번호를 재설정할 수 있습니다.</p>
            </div>

            <div class="step-indicator">
                <div class="step active">1</div>
                <div class="step-line"></div>
                <div class="step">2</div>
            </div>

            <div th:if="${verifyError}" class="alert alert-error">
                <span class="alert-icon">!</span>
                <span th:text="${verifyError}"></span>
            </div>

            <form th:action="@{/forgot-password/verify}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="가입한 아이디를 입력하세요" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="가입한 이메일을 입력하세요" required>
                </div>
                <button type="submit" class="btn-submit">본인 확인하기</button>
            </form>
        </th:block>

        <div class="auth-links">
            <a href="/login">← 로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>

</body>
</html>
