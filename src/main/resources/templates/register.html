<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - CodeEdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        .auth-page {
            --accent: #4f55e7;
            --accent-h: #3f46d5;
            --accent-soft: #eef0ff;
            --accent-glow: rgba(79, 85, 231, .16);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            background:
                radial-gradient(ellipse 70% 60% at 78% 22%, var(--accent-soft) 0%, transparent 58%),
                var(--bg-section);
            position: relative;
            overflow-x: hidden;
        }
        .auth-brand {
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
            padding: 60px 56px; color: #fff;
            background: linear-gradient(150deg, #5b61ea 0%, #4f55e7 46%, #3f46d5 100%);
        }
        .auth-brand::before {
            content: ''; position: absolute;
            top: -120px; right: -120px; width: 360px; height: 360px;
            border-radius: 50%; background: rgba(255,255,255,.10);
        }
        .auth-brand::after {
            content: ''; position: absolute;
            bottom: -140px; left: -90px; width: 320px; height: 320px;
            border-radius: 50%; background: rgba(255,255,255,.07);
        }
        .auth-brand-logo {
            position: relative; z-index: 1;
            display: flex; align-items: center; gap: 10px;
            color: #fff; font-size: 1.3rem; font-weight: 850;
            text-decoration: none; letter-spacing: -.02em;
        }
        .auth-brand-logo em { color: #c8cbff; font-style: normal; }
        .auth-brand-logo-mark {
            width: 38px; height: 38px; border-radius: 10px;
            display: grid; place-items: center;
            background: rgba(255,255,255,.16); font-size: 1.1rem;
        }
        .auth-logo .brand-text { font-size: 1.45rem; }
        .auth-brand-logo .brand-text b { color: #c8cbff; }
        .auth-brand-main { position: relative; z-index: 1; }
        .auth-brand-title {
            margin: 0 0 16px; font-size: 2.2rem; line-height: 1.25;
            font-weight: 850; letter-spacing: -.03em;
        }
        .auth-brand-desc {
            margin: 0 0 30px; font-size: 1.02rem; line-height: 1.7;
            color: rgba(255,255,255,.85);
        }
        .auth-brand-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
        .auth-brand-list li {
            position: relative; padding-left: 30px;
            font-size: .96rem; font-weight: 600; color: rgba(255,255,255,.92);
        }
        .auth-brand-list li::before {
            content: '✓'; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 20px; height: 20px; border-radius: 50%;
            display: grid; place-items: center;
            background: rgba(255,255,255,.18); color: #fff;
            font-size: .7rem; font-weight: 800;
        }
        .auth-brand-foot {
            position: relative; z-index: 1;
            margin: 0; font-size: .8rem; color: rgba(255,255,255,.6);
        }
        .auth-form-side {
            display: flex; align-items: center; justify-content: center;
            padding: 48px 40px;
        }
        @media (max-width: 900px) {
            .auth-page { grid-template-columns: 1fr; }
            .auth-brand { display: none; }
            .auth-form-side { padding: 40px 20px; }
        }
        .auth-card {
            background: transparent;
            border-radius: 0;
            padding: 0;
            width: 100%; max-width: 480px;
            box-shadow: none;
            border: none;
            position: relative;
            z-index: 1;
        }
        .auth-logo {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 36px; text-decoration: none;
        }
        .auth-logo-mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: #4f55e7;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff;
            box-shadow: 0 4px 12px rgba(79,85,231,0.28);
        }
        .auth-logo-name {
            font-size: 1.45rem; font-weight: 800;
            color: var(--ink-1);
            letter-spacing: -0.03em;
        }
        .auth-logo-name em { color: #4f55e7; font-style: normal; }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-title {
            font-size: 1.7rem; font-weight: 800; color: var(--ink-1);
            margin-bottom: 8px; letter-spacing: -0.035em;
        }
        .auth-sub {
            font-size: .95rem; color: var(--ink-2); line-height: 1.6;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: .86rem; font-weight: 600;
            color: var(--ink-1); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px; border-radius: 14px;
            border: 1.5px solid var(--border-card);
            background: var(--bg); color: var(--ink-1);
            font-size: .95rem; font-family: inherit;
            transition: all 0.2s ease; outline: none;
            box-shadow: var(--shadow-xs);
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-sm);
            background: var(--bg-surface);
        }
        .form-group input::placeholder { color: var(--ink-3); }
        .form-group input.input-error { border-color: var(--danger); }
        .form-group input.input-error:focus {
            box-shadow: 0 0 0 4px rgba(239,68,68,0.12);
        }
        .field-error {
            color: var(--danger); font-size: .82rem; font-weight: 600;
            margin-top: 8px; display: block;
            display: flex; align-items: center; gap: 4px;
        }
        .field-error::before { content: '•'; font-size: 1.2rem; line-height: 0; }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-h));
            color: #fff; border: none;
            padding: 16px; border-radius: 16px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; letter-spacing: -0.01em;
            transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 6px 20px rgba(79,85,231,0.30), 0 2px 6px rgba(79,85,231,0.15);
            margin-top: 6px;
        }
        .btn-submit:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(79,85,231,0.38), 0 4px 10px rgba(79,85,231,0.18);
        }
        .btn-submit:active { transform: translateY(0); }
        .auth-links {
            margin-top: 28px;
            font-size: .88rem; color: var(--ink-2);
            text-align: center; line-height: 1.8;
        }
        .auth-links a {
            color: var(--accent); font-weight: 600;
            text-decoration: none; position: relative;
        }
        .auth-links a::after {
            content: ''; position: absolute; bottom: -1px; left: 0;
            width: 0; height: 1.5px; background: var(--accent);
            transition: width 0.25s ease;
        }
        .auth-links a:hover::after { width: 100%; }
    </style>
</head>
<body>

<div class="auth-page">
    <aside class="auth-brand">
        <a href="/" class="auth-brand-logo">
            <span class="brand-text"><b>Coding</b>Edu</span>
        </a>
        <div class="auth-brand-main">
            <h2 class="auth-brand-title">코딩, 지금<br>시작해볼까요?</h2>
            <p class="auth-brand-desc">가입하고 강의 · 퀴즈 · 챌린지로<br>나만의 코딩 포트폴리오를 만들어보세요.</p>
            <ul class="auth-brand-list">
                <li>생활코딩 기반의 체계적인 강의</li>
                <li>퀴즈와 챌린지로 실력 점검</li>
                <li>개발자 커뮤니티에서 함께 성장</li>
            </ul>
        </div>
        <p class="auth-brand-foot">© 2026 CodeEdu. 코딩은 즐거워요!</p>
    </aside>

    <div class="auth-form-side">
    <div class="auth-card reveal">

        <a href="/" class="auth-logo">
            <span class="brand-text"><b>Coding</b>Edu</span>
        </a>

        <div class="auth-header">
            <h2 class="auth-title">1분만에 가입하기</h2>
            <p class="auth-sub">가입하고 나만의 코딩 포트폴리오를 만들어보세요.</p>
        </div>

        <form id="registerForm" th:action="@{/register}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="영문, 숫자 조합 4자 이상"
                       th:value="${user?.username}"
                       th:classappend="${fieldErrors?.containsKey('username')} ? ' input-error'"
                       th:attr="aria-invalid=${fieldErrors?.containsKey('username')} ? 'true' : 'false', aria-describedby=${fieldErrors?.containsKey('username')} ? 'err-username' : null"
                       autofocus>
                <span th:if="${fieldErrors?.containsKey('username')}" id="err-username" class="field-error" role="alert"
                      th:text="${fieldErrors['username']}"></span>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="8자 이상 입력"
                       th:classappend="${fieldErrors?.containsKey('password')} ? ' input-error'"
                       th:attr="aria-invalid=${fieldErrors?.containsKey('password')} ? 'true' : 'false', aria-describedby=${fieldErrors?.containsKey('password')} ? 'err-password' : null">
                <span th:if="${fieldErrors?.containsKey('password')}" id="err-password" class="field-error" role="alert"
                      th:text="${fieldErrors['password']}"></span>
            </div>

            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" placeholder="커뮤니티에서 사용할 별명"
                       th:value="${user?.nickname}"
                       th:classappend="${fieldErrors?.containsKey('nickname')} ? ' input-error'"
                       th:attr="aria-invalid=${fieldErrors?.containsKey('nickname')} ? 'true' : 'false', aria-describedby=${fieldErrors?.containsKey('nickname')} ? 'err-nickname' : null">
                <span th:if="${fieldErrors?.containsKey('nickname')}" id="err-nickname" class="field-error" role="alert"
                      th:text="${fieldErrors['nickname']}"></span>
            </div>

            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="email" placeholder="알림을 받을 이메일 주소"
                       th:value="${user?.email}"
                       th:classappend="${fieldErrors?.containsKey('email')} ? ' input-error'"
                       th:attr="aria-invalid=${fieldErrors?.containsKey('email')} ? 'true' : 'false', aria-describedby=${fieldErrors?.containsKey('email')} ? 'err-email' : null">
                <span th:if="${fieldErrors?.containsKey('email')}" id="err-email" class="field-error" role="alert"
                      th:text="${fieldErrors['email']}"></span>
            </div>

            <button type="submit" class="btn-submit">무료로 가입 완료</button>
        </form>

        <div class="auth-links">
            이미 계정이 있으신가요? <a href="/login">로그인하러 가기</a>
        </div>
    </div>
    </div>
</div>

<script src="/js/nav.js"></script>

<script>
(function () {
  var form = document.getElementById('registerForm');
  if (!form) return;
  form.addEventListener('submit', function () {
    if (!form.reportValidity()) return;
    var btn = form.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.7'; btn.textContent = '가입 중...'; }
  });
})();
</script>
</body>
</html>
