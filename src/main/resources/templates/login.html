<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - CodeEdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex; justify-content: center; align-items: center;
            background:
                radial-gradient(ellipse 80% 60% at 20% 40%, var(--accent-soft) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, var(--mint-soft) 0%, transparent 50%),
                var(--bg-section);
            padding: 48px 20px;
            position: relative;
            overflow: hidden;
        }
        .auth-page::before {
            content: ''; position: absolute;
            top: -200px; right: -100px; width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .auth-card {
            background: var(--bg-surface);
            border-radius: 28px;
            padding: 52px 44px;
            width: 100%; max-width: 440px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-card);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .auth-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 28px 64px rgba(15,23,42,0.10), 0 12px 24px rgba(15,23,42,0.06);
        }
        .auth-logo {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 36px; text-decoration: none;
        }
        .auth-logo-mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--mint));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.28);
        }
        .auth-logo-name {
            font-size: 1.45rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--mint));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-title {
            font-size: 1.7rem; font-weight: 800; color: var(--ink-1);
            margin-bottom: 8px; letter-spacing: -0.035em;
        }
        .auth-sub {
            font-size: .95rem; color: var(--ink-2); line-height: 1.6;
        }
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; font-size: .86rem; font-weight: 600;
            color: var(--ink-1); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px; border-radius: 14px;
            border: 1.5px solid var(--border-card);
            background: var(--bg); color: var(--ink-1);
            font-size: .95rem; font-family: inherit;
            transition: all 0.2s ease; outline: none;
            box-shadow: var(--shadow-xs);
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-sm);
            background: var(--bg-surface);
        }
        .form-group input::placeholder { color: var(--ink-3); }
        .form-group input.input-error { border-color: var(--danger); }
        .form-group input.input-error:focus {
            box-shadow: 0 0 0 4px rgba(239,68,68,0.12);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-h));
            color: #fff; border: none;
            padding: 16px; border-radius: 16px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; letter-spacing: -0.01em;
            transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 6px 20px rgba(16,185,129,0.30), 0 2px 6px rgba(16,185,129,0.15);
            margin-top: 6px;
        }
        .btn-submit:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(16,185,129,0.38), 0 4px 10px rgba(16,185,129,0.18);
        }
        .btn-submit:active { transform: translateY(0); }
        .auth-links {
            margin-top: 28px;
            font-size: .88rem; color: var(--ink-2);
            text-align: center; line-height: 1.8;
        }
        .auth-links a {
            color: var(--accent); font-weight: 600;
            text-decoration: none; position: relative;
        }
        .auth-links a::after {
            content: ''; position: absolute; bottom: -1px; left: 0;
            width: 0; height: 1.5px; background: var(--accent);
            transition: width 0.25s ease;
        }
        .auth-links a:hover::after { width: 100%; }
        .alert {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 14px 16px; border-radius: 14px;
            font-size: .88rem; font-weight: 500; margin-bottom: 24px;
            border: 1px solid transparent;
        }
        .alert-error {
            background: var(--danger-soft); color: var(--danger);
            border-color: rgba(239,68,68,0.12);
        }
        .alert-success {
            background: var(--success-soft); color: var(--success);
            border-color: rgba(16,185,129,0.12);
        }
        .alert-icon {
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .7rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
        }
        .alert-error .alert-icon { background: var(--danger); color: #fff; }
        .alert-success .alert-icon { background: var(--success); color: #fff; }
        .divider {
            display: flex; align-items: center; gap: 14px;
            margin: 24px 0; color: var(--ink-3); font-size: .82rem; font-weight: 500;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }
    </style>
</head>
<body>

<nav th:replace="~{index :: nav}"></nav>

<div class="auth-page">
    <div class="auth-card reveal">

        <a href="/" class="auth-logo">
            <div class="auth-logo-mark">💻</div>
            <span class="auth-logo-name">CodeEdu</span>
        </a>

        <div class="auth-header">
            <h2 class="auth-title">다시 오셨네요!</h2>
            <p class="auth-sub">코딩 학습을 이어가기 위해 로그인해주세요.</p>
        </div>

        <div th:if="${param.error}" id="login-error" class="alert alert-error" role="alert">
            <span class="alert-icon">!</span>
            <span>아이디 또는 비밀번호가 일치하지 않습니다.</span>
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            <span class="alert-icon">✓</span>
            <span>회원가입이 완료됐습니다! 로그인해주세요.</span>
        </div>
        <div th:if="${param.passwordReset}" class="alert alert-success">
            <span class="alert-icon">✓</span>
            <span>비밀번호가 성공적으로 변경됐습니다!</span>
        </div>

        <form id="loginForm" th:action="@{/login_process}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autofocus
                       autocomplete="username"
                       th:classappend="${param.error} ? ' input-error'">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required
                       autocomplete="current-password"
                       th:classappend="${param.error} ? ' input-error'">
            </div>
            <label class="remember-row">
                <input type="checkbox" name="remember-me" value="true">
                <span>로그인 상태 유지</span>
            </label>
            <button type="submit" class="btn-submit">로그인</button>
        </form>

        <div class="divider">또는</div>

        <div class="auth-links">
            아직 계정이 없으신가요? <a href="/register">무료로 회원가입</a>
        </div>
        <div class="auth-links" style="margin-top: 6px;">
            비밀번호를 잊으셨나요? <a href="/forgot-password">비밀번호 찾기</a>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>

<script>
(function () {
  var form = document.getElementById('loginForm');
  if (!form) return;
  form.addEventListener('submit', function () {
    if (!form.reportValidity()) return;
    var btn = form.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.7'; btn.textContent = '로그인 중...'; }
  });
})();
</script>
</body>
</html>
